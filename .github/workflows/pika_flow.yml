name: 🌸 PikaFlow Pipeline

on:
  repository_dispatch:
    types: [run_pipeline]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video prompt (e.g. 'Top 5 free AI art tools – anime style')"
        required: true
        type: string
      format:
        description: "Video format"
        required: false
        default: "medium"
        type: choice
        options: [short, medium, long]

env:
  PIKA_WORK_DIR: ${{ github.workspace }}/pika_work

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 ▸ Init — generate run spec and resolve best LLM providers
  # ──────────────────────────────────────────────────────────────────────────
  init:
    name: 🚀 Init & Spec Generation
    runs-on: ubuntu-24.04
    outputs:
      run_id:     ${{ steps.meta.outputs.run_id }}
      spec_path:  ${{ steps.meta.outputs.spec_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate run metadata
        id: meta
        run: |
          RUN_ID="run-$(date +'%d%m%Y-%H%M')"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "spec_path=pika_work/${RUN_ID}/run_spec.json" >> "$GITHUB_OUTPUT"
          mkdir -p "pika_work/${RUN_ID}"
          echo '{
            "run_id": "'"${RUN_ID}"'",
            "prompt": "${{ github.event.inputs.prompt || github.event.client_payload.prompt }}",
            "format": "${{ github.event.inputs.format || github.event.client_payload.format || 'medium' }}",
            "resolution": "${{ github.event.client_payload.resolution || '' }}",
            "style_keywords": "${{ github.event.client_payload.style_keywords || '' }}",
            "use_music": ${{ github.event.client_payload.use_music != false }},
            "upload_to_youtube": ${{ github.event.client_payload.upload_to_youtube == true }},
            "scenes": []
          }' > "pika_work/${RUN_ID}/run_spec.json"

      - name: Upload spec artifact
        uses: actions/upload-artifact@v7
        with:
          name: run-spec-${{ steps.meta.outputs.run_id }}
          path: pika_work/${{ steps.meta.outputs.run_id }}/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 ▸ Generate video clips (chunked, up to 6 h)
  # ──────────────────────────────────────────────────────────────────────────
  generate:
    name: 🎬 Clip Generation
    needs: init
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PAT_TOKEN:            ${{ secrets.PAT_TOKEN }}
      GITHUB_TOKEN:         ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      GH_TOKEN:             ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
      HUGGINGFACE_API_KEY:  ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_TOKEN }}
      HF_TOKEN:             ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_API_KEY }}
      CLOUDFLARE_VIDEO_API_URL: ${{ secrets.CLOUDFLARE_VIDEO_API_URL || vars.CLOUDFLARE_VIDEO_API_URL }}
      CLOUDFLARE_API_KEY:       ${{ secrets.CLOUDFLARE_API_KEY }}
      HF_VIDEO_SPACE:           ${{ secrets.HF_VIDEO_SPACE || vars.HF_VIDEO_SPACE }}
      FREESOUND_API_KEY:    ${{ secrets.FREESOUND_API_KEY }}
      YOUTUBE_CLIENT_ID:    ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      RUN_ID:               ${{ needs.init.outputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download spec artifact
        uses: actions/download-artifact@v7
        with:
          name: run-spec-${{ env.RUN_ID }}
          path: pika_work/${{ env.RUN_ID }}/

      - name: Discover and benchmark live models
        run: python -m pika_flow.discovery || true

      - name: Generate clips and pipeline assets
        run: python -m pika_flow.orchestrator pika_work/${{ env.RUN_ID }}/run_spec.json

      - name: Upload run assets and clips
        uses: actions/upload-artifact@v7
        with:
          name: clips-${{ env.RUN_ID }}
          path: pika_work/${{ env.RUN_ID }}/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 ▸ Edit — AI timeline editing (FFmpeg)
  # ──────────────────────────────────────────────────────────────────────────
  edit:
    name: ✂️ Video Editor
    needs: [init, generate]
    runs-on: ubuntu-24.04
    env:
      RUN_ID: ${{ needs.init.outputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download clips artifact
        uses: actions/download-artifact@v7
        with:
          name: clips-${{ env.RUN_ID }}
          path: pika_work/${{ env.RUN_ID }}/

      - name: Run video editor
        run: python -m pika_flow.video_editor pika_work/${{ env.RUN_ID }}/

      - name: Upload final video
        uses: actions/upload-artifact@v7
        with:
          name: final-${{ env.RUN_ID }}
          path: pika_work/${{ env.RUN_ID }}/${{ env.RUN_ID }}.mp4
          retention-days: 2

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 ▸ Release — create GitHub release and attach all assets
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: 📦 GitHub Release
    needs: [init, edit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RUN_ID: ${{ needs.init.outputs.run_id }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download clips and pipeline metadata
        uses: actions/download-artifact@v7
        with:
          name: clips-${{ env.RUN_ID }}
          path: pika_work/${{ env.RUN_ID }}/

      - name: Download final video
        uses: actions/download-artifact@v7
        with:
          name: final-${{ env.RUN_ID }}
          path: pika_work/${{ env.RUN_ID }}/

      - name: Create or update GitHub release
        run: |
          ASSETS=()
          for f in pika_work/${{ env.RUN_ID }}/${{ env.RUN_ID }}.mp4 \
                   pika_work/${{ env.RUN_ID }}/thumbnail.jpg \
                   pika_work/${{ env.RUN_ID }}/seo_metadata.json \
                   pika_work/${{ env.RUN_ID }}/seo_brief.json \
                   pika_work/${{ env.RUN_ID }}/run_spec.json \
                   pika_work/${{ env.RUN_ID }}/log.jsonl \
                   pika_work/${{ env.RUN_ID }}/summary.md; do
            if [ -f "$f" ]; then
              ASSETS+=("$f")
            fi
          done

          if gh release view "${{ env.RUN_ID }}" >/dev/null 2>&1; then
            echo "Release ${{ env.RUN_ID }} already exists. Syncing assets..."
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "${{ env.RUN_ID }}" "${ASSETS[@]}" --clobber || true
            fi
          else
            echo "Creating new release ${{ env.RUN_ID }} with ${#ASSETS[@]} assets..."
            gh release create "${{ env.RUN_ID }}" \
              --title "🌸 PikaFlow ${{ env.RUN_ID }}" \
              --notes "Automated Animerise video run." \
              "${ASSETS[@]}"
          fi

      - name: Discord alert (optional)
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ PikaFlow run **${{ env.RUN_ID }}** complete! Check the release for the final video.\"}"

